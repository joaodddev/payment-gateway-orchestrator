spring:
  application:
    name: payment-gateway-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5433/pgwdb
    username: pgwuser
    password: pgwpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6380

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-gateway-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8081

app:
  jwt:
    secret: 7hN2kP5mQ8rS1tV4wX6yZ3aB0cD9eF11
    expiration-ms: 86400000
  kafka:
    topics:
      payment-created: payment.created
      payment-processed: payment.processed
      payment-failed: payment.failed
  resilience:
    retry-max-attempts: 3
    circuit-breaker-threshold: 50
  idempotency:
    ttl-minutes: 1440

resilience4j:
  retry:
    instances:
      paymentProcessing:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.TransientDataAccessException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
          - java.util.NoSuchElementException

  circuitbreaker:
    instances:
      paymentProcessing:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.TransientDataAccessException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true