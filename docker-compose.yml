version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: pgw_postgres
    environment:
      POSTGRES_DB: pgwdb
      POSTGRES_USER: pgwuser
      POSTGRES_PASSWORD: pgwpass
    ports:
      - "5433:5432"
    volumes:
      - pgw_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pgw_redis
    ports:
      - "6380:6379"
    volumes:
      - pgw_redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pgw_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pgw_kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  pgw_postgres_data:
  pgw_redis_data: